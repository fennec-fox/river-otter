logging:
  level:
    io.mustelidae.riverotter: info
    org.springframework.boot.actuate: off
    org.springframework.web: debug
    org.springframework.boot: info
    org.hibernate.SQL: debug
    org.hibernate.tool.schema: error
    com.zaxxer.hikari: error
    io.swagger.models.parameters.AbstractSerializableParameter: error

server:
  error:
    include-stacktrace: always
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  port: 6400

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/riverOtter?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mvc:
    log-request-details: true

springdoc:
  show-actuator: false
  swagger-ui:
    enabled: true
    tags-sorter: alpha

app:
  available-countries: KR,US
  country:
    korea:
      saturday-is-holiday: true
  client:
    government:
      use-dummy: true
      host: http://apis.data.go.kr
